[package]
name = "jarvis-desktop"
version = "1.0.1"
description = "JARVIS Local Console — offline voice assistant desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
open = "5"
enigo = "0.2"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
