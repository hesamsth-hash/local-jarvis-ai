[package]
name = "jarvis-desktop"
version = "1.1.3"
description = "JARVIS Local Console — offline voice assistant for desktop & Android"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
# Both platforms: desktop encodes screenshots to PNG; Android's root
# screencap bytes get base64-encoded for the vision pipeline.
base64 = "0.22"

# Desktop-only OS powers — excluded from the Android build where they don't
# apply. On Android the same commands run through root shell tools instead
# (screencap / input / am / su) — see src/lib.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
open = "5"
enigo = "0.2"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
