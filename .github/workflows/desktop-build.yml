name: Build Windows installer

# Builds the native Windows app (.exe installer) for every push to main and
# version tags. You never need Rust locally — push and download.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # also runnable manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to attach installers to a release
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app + installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # releaseId is only set on tag pushes — regular pushes still produce artifacts
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'JARVIS Local Console' || '' }}
          args: --target x86_64-pc-windows-msvc

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error
