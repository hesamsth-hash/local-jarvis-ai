name: Build Android APK

# Builds the native Android app (.apk) for every push to main and version
# tags. You never need Android Studio or the NDK locally — push and download.
#
# The APK is debug-signed (auto-generated key, handled by the Android build).
# That's ideal for side-loading: it installs on any device. Play Store
# distribution would need a proper release keystore — see ANDROID.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # also runnable manually from the Actions tab

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # GitHub's ubuntu runners ship the Android SDK + NDK; find the newest
      # preinstalled NDK and export it for the Tauri CLI.
      - name: Export Android NDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort | tail -n1)
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      # CI=true (not 1!) — the CLI auto-maps the env var to its --ci flag,
      # which only accepts true/false. Skips interactive prompts.
      - name: Initialize Android project
        run: bun tauri android init
        env:
          CI: "true"

      - name: Build APK (aarch64)
        run: bun tauri android build --apk --debug --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
